<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMOKE: running…</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0; background: #111; color: #eee;
  }
  #banner {
    padding: 24px; font-size: 28px; font-weight: 800; text-align: center;
    color: #fff;
  }
  #banner.pass { background: #0f5132; }
  #banner.fail { background: #842029; }
  #banner.run  { background: #533f03; }
  #summary { padding: 8px 24px; font-size: 15px; color: #bbb; text-align: center; }
  #results { padding: 16px 24px; max-width: 720px; margin: 0 auto; }
  .line { padding: 4px 0; border-bottom: 1px solid #222; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pass-line { color: #4ade80; }
  .fail-line { color: #f87171; font-weight: 700; }
  .pass-line::before { content: "✓ "; }
  .fail-line::before { content: "✗ "; }
</style>
</head>
<body>
<div id="banner" class="run">SMOKE: running…</div>
<div id="summary"></div>
<div id="results"></div>

<!--
  Smoke test — load ALL the real app scripts in the SAME order as
  psycle-finder.html, then assert the critical globals exist and a few pure
  functions behave. A missing global produces a FAIL *line*, never a thrown
  page: every check is wrapped so the harness always reaches the final banner.

  Run by opening this file in a browser / iOS simulator (served, ideally:
  `python3 -m http.server 8080` then open /tests/smoke.html). The big banner
  and document.title ("SMOKE: PASS" / "SMOKE: FAIL") report the result.

  NOTE: these scripts are NOT deferred here (unlike psycle-finder.html, which
  uses `defer`). Loaded synchronously in order, each finishes before the next
  starts, so by the time the final smoke-runner script runs every module is
  fully evaluated. We only assert that the symbols are present and the right
  type, plus a few pure-logic checks.

  The script list must stay identical to psycle-finder.html's, in the same
  order — tests/suites/shell.js fails `npm test` when the two drift apart.
-->
<script>
// A module that throws while LOADING leaves nothing the checks below can see:
// function declarations are hoisted, so `typeof search` is "function" for an
// app.js that died on its first line (every const in its TDZ, no listeners, no
// init). Collected from here — ahead of every app script, and of the
// window.onerror reliability.js installs later — and reported by the runner.
// In a script of its own: tests/suites/shell.js evaluates the fetch stub below
// in a bare sandbox. Only a throw (target: window) or a script that failed to
// load counts; a stray image or font error must not turn the page red.
(function () {
  var errors = window.__smokeLoadErrors = [];
  window.addEventListener('error', function (e) {
    var target = e && e.target;
    if (target === window) {
      errors.push((e.message || 'error') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : ''));
    } else if (target && target.tagName === 'SCRIPT') {
      errors.push('could not load ' + (target.getAttribute('src') || 'a script'));
    }
  }, true); // capture: a failed load does not bubble
})();
</script>
<script>
// Hermetic. app.js starts itself the moment it loads: /instructors, /locations
// and /event-types, plus /profile when this origin holds a token. Psycle's API
// is a live booking system and this page must never reach it, so every request
// is answered here. The answer is a 200 with an empty list on purpose: a 200
// that is not a profile leaves a stored session "unverified", which keeps the
// token — a 401 would sign the developer out of the app on this origin.
(function () {
  function smokeFetchStub() {
    return Promise.resolve(new Response('{"data":[]}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
  }
  window.__smokeFetchStub = smokeFetchStub;
  window.fetch = smokeFetchStub;
})();
</script>
<script src="../js/state.js"></script>
<script src="../js/security.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/facets.js"></script>
<script src="../js/app.js"></script>
<script src="../js/reliability.js"></script>
<script src="../js/interactions.js"></script>
<script src="../js/performance.js"></script>
<script src="../js/calendar.js"></script>
<script src="../js/features.js"></script>
<script src="../js/tabs.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/explore.js"></script>
<script src="../js/api-client.js"></script>
<script src="../js/diagnostic.js"></script>

<script>
(function () {
  'use strict';

  var passed = 0, failed = 0;
  var resultsEl = document.getElementById('results');

  function line(isPass, msg) {
    if (isPass) passed++; else failed++;
    var div = document.createElement('div');
    div.className = 'line ' + (isPass ? 'pass-line' : 'fail-line');
    div.textContent = msg;
    resultsEl.appendChild(div);
  }

  // Assert a global exists and is the expected type. Never throws.
  function checkType(name, expectedType) {
    try {
      var val = window[name];
      var actual = typeof val;
      if (actual === expectedType) {
        line(true, name + ' is a ' + expectedType);
      } else {
        line(false, name + ' expected ' + expectedType + ', got ' + actual);
      }
    } catch (e) {
      line(false, name + ' threw: ' + (e && e.message));
    }
  }

  // Assert a nested property (e.g. PsycleAPI.categorizeError) exists + type.
  function checkMember(objName, member, expectedType) {
    try {
      var obj = window[objName];
      if (!obj) { line(false, objName + ' missing (cannot check .' + member + ')'); return; }
      var actual = typeof obj[member];
      if (actual === expectedType) {
        line(true, objName + '.' + member + ' is a ' + expectedType);
      } else {
        line(false, objName + '.' + member + ' expected ' + expectedType + ', got ' + actual);
      }
    } catch (e) {
      line(false, objName + '.' + member + ' threw: ' + (e && e.message));
    }
  }

  function checkEqual(label, actual, expected) {
    try {
      if (actual === expected) {
        line(true, label);
      } else {
        line(false, label + '  (expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual) + ')');
      }
    } catch (e) {
      line(false, label + ' threw: ' + (e && e.message));
    }
  }

  // ── Critical globals: search / booking / render pipeline (app.js etc.) ──
  checkType('search', 'function');
  checkType('bookClass', 'function');
  checkType('submitBooking', 'function');
  checkType('render', 'function');
  checkType('escapeHTML', 'function');
  checkType('eventCard', 'function');
  checkType('checkAuth', 'function');
  checkType('fetchMyBookings', 'function');

  // ── Filter core (facets.js — loads before app.js, which calls it) ──
  checkType('PsycleFacets', 'object');
  checkMember('PsycleFacets', 'run', 'function');

  // ── Waitlists (app.js — separate /waitlists resource) ──
  checkType('fetchMyWaitlists', 'function');
  checkType('joinWaitlist', 'function');
  checkType('leaveWaitlist', 'function');
  checkType('claimWaitlistSpot', 'function');

  // ── Discover Time row (app.js — reached BY NAME from inline onclicks and interactions.js) ──
  checkType('toggleTimeBand', 'function');
  checkType('toggleAvailableOnly', 'function');
  checkType('clearTimeFilters', 'function');
  checkType('setTimeFilters', 'function');

  // ── The ONE time formatter (app.js pure:clock — called BY NAME, unguarded, from tabs / features / reliability) ──
  checkType('_clock24', 'function');
  checkType('_clockOf', 'function');

  // ── Weekly template + recent searches + insights (tabs/app/explore) ──
  checkType('bookWeeklyTemplate', 'function');
  checkType('getRecentSearches', 'function');
  checkType('renderInsights', 'function');

  // ── Filters bar, day pager + the shared swipe helper, Stats sub-pages, welcome ──
  //    Each is reached BY NAME: from an inline onclick, or from another module
  //    (interactions.js → app.js's day pager; tabs.js → interactions.js's helper).
  checkType('toggleFilters', 'function');
  checkType('removeFilterChip', 'function');
  checkType('showDiscoverDay', 'function');
  checkType('_dayPagerSwipe', 'object');
  checkType('_psycleSwipe', 'function');
  checkType('showStatsPage', 'function');
  checkType('replayOnboarding', 'function');

  // ── Diagnostics UI + resilience layer (settings/diagnostic/api-client) ──
  checkType('openDiagnostics', 'function');
  checkType('PsycleAPI', 'object');
  checkType('PsycleDiag', 'object');
  checkType('PsycleState', 'object');
  checkType('PsycleEvents', 'object');

  // ── PsycleAPI surface ──
  checkMember('PsycleAPI', 'categorizeError', 'function');
  checkMember('PsycleAPI', 'validate', 'function');
  checkMember('PsycleAPI', 'field', 'function');
  checkMember('PsycleAPI', 'parseJson', 'function');
  checkMember('PsycleAPI', 'getWaitlists', 'function');
  checkMember('PsycleAPI', 'SCHEMAS', 'object');

  // ── PsycleDiag surface ──
  checkMember('PsycleDiag', 'record', 'function');
  checkMember('PsycleDiag', 'checkContract', 'function');

  // ── A few pure checks (no network, no DOM mutation) ──
  try {
    checkEqual('escapeHTML("<b>") === "&lt;b&gt;"', window.escapeHTML('<b>'), '&lt;b&gt;');
  } catch (e) { line(false, 'escapeHTML pure check threw: ' + (e && e.message)); }

  try {
    var cat401 = window.PsycleAPI && window.PsycleAPI.categorizeError({ status: 401, ok: false });
    checkEqual('categorizeError({status:401}).type === "auth"', cat401 && cat401.type, 'auth');
    var catNet = window.PsycleAPI && window.PsycleAPI.categorizeError(new TypeError('Failed to fetch'));
    checkEqual('categorizeError(TypeError "Failed to fetch").type === "network"', catNet && catNet.type, 'network');
  } catch (e) { line(false, 'categorizeError pure check threw: ' + (e && e.message)); }

  try {
    var vBad = window.PsycleAPI && window.PsycleAPI.validate('event', { id: 1 });
    checkEqual('validate("event",{id:1}).ok === false', vBad && vBad.ok, false);
  } catch (e) { line(false, 'validate pure check threw: ' + (e && e.message)); }

  try {
    var faceted = window.PsycleFacets && window.PsycleFacets.run(
      [{ _instrName: 'A', start_at: '2026-01-01 07:00:00' }, { _instrName: 'B', start_at: '2026-01-01 08:00:00' }], { instructor: ['A'] });
    checkEqual('PsycleFacets.run(two classes, instructor A).total === 1', faceted && faceted.total, 1);
  } catch (e) { line(false, 'PsycleFacets pure check threw: ' + (e && e.message)); }

  // ── Every module ran to its end (the typeof checks above cannot tell) ──
  var loadErrors = window.__smokeLoadErrors;
  if (!Array.isArray(loadErrors)) line(false, 'the load-error listener is missing (it must come before the first app script)');
  else if (loadErrors.length === 0) line(true, 'no script threw or failed to load');
  else loadErrors.forEach(function (m) { line(false, 'threw while loading: ' + m); });

  // ── Hermetic: no module may have swapped the real fetch back in ──
  checkEqual('window.fetch is still the local stub (nothing here can reach the live API)', window.fetch === window.__smokeFetchStub, true);

  // ── Banner + title ──
  var banner = document.getElementById('banner');
  var summary = document.getElementById('summary');
  var total = passed + failed;
  if (failed === 0) {
    banner.className = 'pass';
    banner.textContent = 'SMOKE: PASS';
    document.title = 'SMOKE: PASS';
  } else {
    banner.className = 'fail';
    banner.textContent = 'SMOKE: FAIL';
    document.title = 'SMOKE: FAIL';
  }
  summary.textContent = passed + ' passed, ' + failed + ' failed (' + total + ' checks)';
})();
</script>
</body>
</html>
