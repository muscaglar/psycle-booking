<script id="themeBoot">

// psycle-finder.html (tests compare the two, and the map with APP_THEMES in
// theme.js). This page used to be fixed Noir-and-red whatever the app wore.
(function () {
  try {
    var BG = { cloud: '#efeee9', linen: '#e8e1d5', graphite: '#131418', terminal: '#060906', synthwave: '#140a24', gameboy: '#0f380f', blueprint: '#0a1c30' };
    var id = null;
    try { id = localStorage.getItem('psycle_theme'); } catch (e) {}
    if (!id || !Object.prototype.hasOwnProperty.call(BG, id)) {
      id = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'graphite' : 'cloud';
    }
    document.documentElement.setAttribute('data-theme', id);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', BG[id]);
  } catch (e) {}
})();
</script>

  /* ── Design tokens — the handful this page needs, copied value for value
     from css/theme.css (tests/suites/4f-cleanup-pwa.js compares them, theme by
     theme). Inlined, not linked: the page must stand on its own, and the iOS
     build copies it as-is into a flat folder where a css/ path would not
     resolve. <html data-theme> is always one of these ids (see themeBoot). ── */
  :root {
    --radius-xl: 10px; --radius-5xl: 18px; --radius-full: 9999px;
    --font-body: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  [data-theme="cloud"] {
    --bg: #efeee9; --bg-panel: #ffffff; --bg-input: #f5f4ef; --border: #e7e5df; --border-light: #d9d7cf;
    --text: #17181c; --text-heading: #0e0f12; --text-muted: #5c5e63; --text-dim: #606267; --text-ghost: #6a6c71; --text-off: #8e9094;
    --accent: #1f6f5c; --accent-hover: #195c4c; --accent-ink: #ffffff; --accent-soft: #e2ede7;
    --badge-full-bg: #fde8ec; --badge-full-text: #b82d46; --badge-full-border: #f5b3bf;
    --shadow-lg: 0 4px 14px rgba(40,40,30,0.06), 0 14px 44px rgba(40,40,30,0.10);
  }
  [data-theme="linen"] {
    --bg: #e8e1d5; --bg-panel: #fbf8f2; --bg-input: #f1eadd; --border: #e1d8c9; --border-light: #d3c8b5;
    --text: #2a2521; --text-heading: #1d1916; --text-muted: #5e574d; --text-dim: #625a4f; --text-ghost: #6b6358; --text-off: #91877a;
    --accent: #b5573c; --accent-hover: #9c4831; --accent-ink: #fff9f4; --accent-soft: #f1e1d7;
    --badge-full-bg: #f7e1dc; --badge-full-text: #96442d; --badge-full-border: #e6bcb0;
    --shadow-lg: 0 4px 14px rgba(60,50,40,0.07), 0 14px 44px rgba(60,50,40,0.12);
  }
  [data-theme="graphite"] {
    --bg: #131418; --bg-panel: #1c1e24; --bg-input: #23262d; --border: #2c2f37; --border-light: #3a3e47;
    --text: #ececea; --text-heading: #ffffff; --text-muted: #9da0a8; --text-dim: #93969d; --text-ghost: #83858c; --text-off: #494c54;
    --accent: #7fc2a6; --accent-hover: #6aae92; --accent-ink: #0e1a15; --accent-soft: #1e2a26;
    --badge-full-bg: #2a1416; --badge-full-text: #f08a9a; --badge-full-border: #4a242a;
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.30), 0 12px 40px rgba(0,0,0,0.45);
  }
  [data-theme="terminal"] {
    --bg: #060906; --bg-panel: #0a120a; --bg-input: #0e1a0e; --border: #16341a; --border-light: #1f4a25;
    --text: #b8e6b8; --text-heading: #e4ffe4; --text-muted: #8cc78c; --text-dim: #6da86d; --text-ghost: #3f6b3f; --text-off: #2c4c2c;
    --accent: #16a34a; --accent-hover: #15803d; --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #271010; --badge-full-text: #f87171; --badge-full-border: #4a1d1d;
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4), 0 0 32px rgba(22,163,74,0.12);
    --font-body: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  [data-theme="synthwave"] {
    --bg: #140a24; --bg-panel: #1c1133; --bg-input: #251746; --border: #322055; --border-light: #44307a;
    --text: #efe6ff; --text-heading: #ffffff; --text-muted: #c2a9e8; --text-dim: #a489cf; --text-ghost: #64508a; --text-off: #483a64;
    --accent: #ff2d95; --accent-hover: #e0187d; --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #3c1030; --badge-full-text: #ff7eb9; --badge-full-border: #6e2257;
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4), 0 0 40px rgba(255, 45, 149, 0.18);
  }
  [data-theme="gameboy"] {
    --bg: #0f380f; --bg-panel: #133f13; --bg-input: #1b4d1b; --border: #306230; --border-light: #3f7a3f;
    --text: #9bbc0f; --text-heading: #c6e034; --text-muted: #8bac0f; --text-dim: #79991c; --text-ghost: #527029; --text-off: #3f5c28;
    --accent: #9bbc0f; --accent-hover: #8bac0f; --accent-ink: #0f380f; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #2a572a; --badge-full-text: #c6e034; --badge-full-border: #3f7a3f;
    --shadow-lg: 0 4px 0 rgba(0, 0, 0, 0.25);
    --radius-xl: 0; --radius-5xl: 0; --radius-full: 0;
    --font-body: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  [data-theme="blueprint"] {
    --bg: #0a1c30; --bg-panel: #0e2440; --bg-input: #132d4e; --border: #1c3d61; --border-light: #295380;
    --text: #d8e9f9; --text-heading: #ffffff; --text-muted: #a4c4e0; --text-dim: #84a8c8; --text-ghost: #4d6d89; --text-off: #364f66;
    --accent: #38bdf8; --accent-hover: #1ba2dd; --accent-ink: #06283f; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #3a1525; --badge-full-text: #ff8097; --badge-full-border: #66293f;
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.35), 0 12px 40px rgba(0,0,0,0.5);
  }
  body {
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-5xl); padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
  /* The logo's strokes are presentation attributes (fixed white / red): these
     rules outrank them, so the mark follows the theme like the wordmark. */
  .brand svg circle { stroke: var(--text-heading); }
  .brand svg path { stroke: var(--accent); }
  .brand .word { font-family: 'AppDisplay', -apple-system, sans-serif; font-size: 21px; letter-spacing: 0.05em; color: var(--text-heading); text-transform: uppercase; line-height: 1; }
  .brand .word .dot { color: var(--accent); }
  .brand .tag { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  h1 { font-size: 21px; font-weight: 600; color: var(--text-heading); margin-bottom: 6px; letter-spacing: 0.01em; }
  .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 26px; line-height: 1.5; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 7px; }
  input[type="email"], input[type="password"] {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); color: var(--text); font-family: inherit;
    padding: 14px 16px; border-radius: var(--radius-xl); font-size: 16px; outline: none; transition: border-color 0.15s; -webkit-appearance: none;
  }
  input::placeholder { color: var(--text-ghost); opacity: 1; }
  input:focus { border-color: var(--accent); }
  /* Accent fills are labelled with --accent-ink, never white: on Graphite,
     Handheld and Blueprint the accent is pale and white is unreadable. */
  .btn {
    display: block; width: 100%; background: var(--accent); color: var(--accent-ink); border: none; font-family: inherit;
    padding: 15px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer; text-align: center; margin-top: 10px; transition: background 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  /* Same pair as the app's .btn:disabled ("Wait 30s" has to stay readable). */
  .btn:disabled { background: var(--text-off); color: var(--text); cursor: not-allowed; }
  .error { background: var(--badge-full-bg); border: 1px solid var(--badge-full-border); color: var(--badge-full-text); border-radius: var(--radius-xl); padding: 12px 14px; font-size: 13px; margin-top: 16px; display: none; line-height: 1.4; }
  .done-wrap { text-align: center; }
  .ok-mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: var(--radius-full); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim); text-decoration: none; }
  .back:hover { color: var(--text-muted); }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 7px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="36" height="22" viewBox="0 0 30 18" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="6" cy="9" r="3.7" stroke="#fff" stroke-width="2"/>
      <circle cx="24" cy="9" r="3.7" stroke="#fff" stroke-width="2"/>
      <path d="M9.7 9c1.7-2.3 3.2-2.3 4.9 0s3.2 2.3 4.9 0" stroke="#e94560" stroke-width="2"/>
    </svg>
    <span class="word">Psync<span class="dot">.</span></span>
    <span class="tag">Psycle Companion</span>
  </div>

  <div id="sLogin">
    <h1>Sign in</h1>
    <p class="sub">Use your Psycle account email and password.</p>
    <!-- A real form: Enter submits, and password managers / VoiceOver see a
         login. preventDefault() comes FIRST, so a script error can never turn
         into a native submit — and the fields deliberately have no name=, so
         even a native submit could not put the password in the URL. -->
    <form id="loginForm" novalidate onsubmit="event.preventDefault();doLogin()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" inputmode="email" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button id="loginBtn" class="btn" type="submit">Sign in</button>
    </form>
    <div id="errMsg" class="error" role="alert"></div>
    <a href="./psycle-finder.html" class="back">&larr; Back to Psync</a>
  </div>

  <div id="sDone" style="display:none" class="done-wrap">
    <div class="ok-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
    <h1>Connected</h1>
    <p class="sub">Returning to Psync&hellip;</p>
    <a href="./psycle-finder.html" class="btn" style="text-decoration:none;margin-top:0">Open Psync</a>
  </div>
</div>

<script>
var APP_URL = (function() {
  var href = location.href;
  var base = href.substring(0, href.lastIndexOf('/') + 1);
  return base + 'psycle-finder.html';
})();

var LOGIN_URL = 'https://psycle.codexfit.com/api/v1/customer/auth/login';

var MAX_ATTEMPTS = 3;
var COOLDOWN_BASE = 30;
var RATE_LIMIT_COOLDOWN = 60; // seconds to stand off after a 429
var LOGIN_TIMEOUT_MS = 15000; // same cap as the app's apiFetch
var _failCount = 0;
var _lockedUntil = 0;
var _cooldownInterval = null;

function checkRateLimit() {
  if (Date.now() < _lockedUntil) {
    var secs = Math.ceil((_lockedUntil - Date.now()) / 1000);
    showError('Too many attempts. Try again in ' + secs + 's.');
    return false;
  }
  return true;
}

// Lock the button for `seconds`, counting down on it.
function startCooldown(seconds) {
  _lockedUntil = Date.now() + seconds * 1000;
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  if (_cooldownInterval) clearInterval(_cooldownInterval);
  var updateCountdown = function() {
    var secs = Math.ceil((_lockedUntil - Date.now()) / 1000);
    if (secs <= 0) {
      clearInterval(_cooldownInterval);
      btn.disabled = false;
      btn.textContent = 'Sign in';
      hideError();
      return;
    }
    btn.textContent = 'Wait ' + secs + 's';
  };
  updateCountdown();
  _cooldownInterval = setInterval(updateCountdown, 1000);
}

// Only an answer that means "Psycle looked at these details and said no"
// counts towards the lockout: a 4xx other than 408 (timeout) / 429 (rate
// limit). Psycle's exact bad-credentials status isn't known, so no single
// code is hard-wired. A dropped connection, a timeout or a 5xx says nothing
// about the password — three taps on a flaky train used to lock a member out.
function countsTowardLockout(status) {
  return status >= 400 && status < 500 && status !== 408 && status !== 429;
}

function onLoginFailure() {
  _failCount++;
  if (_failCount >= MAX_ATTEMPTS) {
    startCooldown(COOLDOWN_BASE * Math.pow(2, Math.floor((_failCount - MAX_ATTEMPTS) / MAX_ATTEMPTS)));
  }
}

function onLoginSuccess() {
  _failCount = 0;
  _lockedUntil = 0;
  if (_cooldownInterval) clearInterval(_cooldownInterval);
}

// The first human-readable line of a failed sign-in. Psycle sends `message`,
// or Laravel-style `errors` ({field: [msg, …]}), which used to be shown as raw
// JSON. Always a plain string: it goes into textContent.
function firstErrorMessage(data, status) {
  if (status === 429) return 'Too many attempts — give it a minute, then try again.';
  if (status >= 500) return 'Psycle is having trouble right now — try again shortly.';
  var pick = function(v) {
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) return v.length ? pick(v[0]) : '';
    if (v && typeof v === 'object') {
      if (typeof v.message === 'string') return v.message;
      var keys = Object.keys(v);
      return keys.length ? pick(v[keys[0]]) : '';
    }
    return '';
  };
  var msg = typeof data === 'string' ? data
    : (data ? (pick(data.message) || pick(data.error) || pick(data.errors)) : '');
  msg = String(msg || '').trim().slice(0, 200);
  return msg || 'Sign in failed (' + status + ')';
}

function showError(msg) {
  var el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errMsg').style.display = 'none';
}

var _loginInFlight = false;

async function doLogin() {
  if (_loginInFlight) return;
  if (!checkRateLimit()) return;

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');

  if (!email || !password) {
    showError('Please enter your email and password.');
    return;
  }
  _loginInFlight = true;

  hideError();
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in&hellip;';

  // A hung request used to spin until the OS gave up (about a minute on iOS).
  // The timer stays armed until the body has been read — that can hang too.
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function() { ctrl.abort(); }, LOGIN_TIMEOUT_MS) : null;

  try {
    var res = await fetch(LOGIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: email, password: password }),
      signal: ctrl ? ctrl.signal : undefined
    });

    var data = await res.json().catch(function(e) {
      if (e && e.name === 'AbortError') throw e; // timed out mid-body: not "an empty answer"
      return {};
    });
    clearTimeout(timer);
    if (data == null) data = {};

    if (res.ok) {
      var token = data.token || data.access_token || data.bearer_token
        || (data.data && (data.data.token || data.data.access_token || data.data.bearer_token));

      if (token) {
        onLoginSuccess();
        if (window.opener) {
          // Never broadcast the token with '*': only our own origin may
          // receive it. file:// contexts have no usable origin (the opener
          // reports 'null', and some browsers report 'file://' here — both
          // would make postMessage drop the token) — keep '*' there,
          // matching the relaxed check on the receiving side.
          var target = (location.protocol !== 'file:' && location.origin && location.origin !== 'null')
            ? location.origin : '*';
          window.opener.postMessage({ type: 'PSYCLE_LOGIN_TOKEN', token: token }, target);
        }
        localStorage.setItem('psycle_bearer_token', token);
        document.getElementById('password').value = '';
        document.getElementById('sLogin').style.display = 'none';
        document.getElementById('sDone').style.display = '';
        if (window.opener) {
          setTimeout(function() { window.close(); }, 1200);
        } else {
          setTimeout(function() { location.href = APP_URL; }, 1500);
        }
      } else {
        // Field NAMES only — the body of a successful sign-in holds a live
        // token under some name we don't know; it must not land in a console
        // that gets pasted into a bug report.
        var inner = (data && typeof data.data === 'object' && data.data) ? Object.keys(data.data) : [];
        console.log('[psync-login] response fields:', typeof data === 'object' ? Object.keys(data) : typeof data, inner);
        showError('Signed in but no token was returned. Check the console and report the field names.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
        _loginInFlight = false;
      }
    } else {
      if (countsTowardLockout(res.status)) onLoginFailure();
      else if (res.status === 429) startCooldown(RATE_LIMIT_COOLDOWN);
      showError(firstErrorMessage(data, res.status));
      if (Date.now() >= _lockedUntil) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
      _loginInFlight = false;
    }
  } catch (e) {
    // Never reached Psycle (or never heard back): says nothing about the
    // password, so it never counts towards the lockout.
    clearTimeout(timer);
    showError(e && e.name === 'AbortError'
      ? 'Psycle took too long to answer. Check your connection and try again.'
      : 'Network error. Check your connection and try again.');
    if (Date.now() >= _lockedUntil) {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
    _loginInFlight = false;
  }
}
</script>
</body>
</html>
