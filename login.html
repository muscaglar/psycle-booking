<!DOCTYPE html>
<html lang="en" data-theme="cloud">
<head>
<meta charset="UTF-8">
<!-- The one page that sees the Psycle password gets the tightest policy in the
     app: nothing loads from anywhere but this origin, the only host it can
     talk to is Psycle, and form-action 'none' makes "this form can never
     submit natively" structural (it already relies on preventDefault() and
     name-less fields). 'unsafe-inline' because the page is self-contained:
     inline script and style, inline handlers. No frame-ancestors: browsers
     ignore it in a <meta> policy — the framebust below does that job. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src https://psycle.codexfit.com; form-action 'none'; base-uri 'none';">
<!-- What every current browser does by default, pinned for older WebKit:
     cross-origin requests (the sign-in POST) see this origin, never the URL. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<script data-framebust>
// Same framebust as psycle-finder.html. (The attribute is deliberate:
// tests/suites/offline.js runs the page's first attribute-less script block
// as the sign-in logic.)
try { if (window.top !== window.self) window.top.location = window.location; }
catch (e) { document.documentElement.style.display = 'none'; }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in &middot; Psync</title>
<meta name="theme-color" content="#e6e9ee">
<script id="themeBoot">
// First paint in the member's own theme — the same script as the head of
// psycle-finder.html (tests compare the two, and the map with APP_THEMES in
// theme.js). This page used to be fixed Noir-and-red whatever the app wore.
(function () {
  try {
    var BG = { cloud: '#e6e9ee', graphite: '#12161f', terminal: '#060906', gameboy: '#0f380f', blueprint: '#0a1c30' };
    var RETIRED = { linen: 'cloud', synthwave: 'graphite' };
    var id = null;
    try { id = localStorage.getItem('psycle_theme'); } catch (e) {}
    if (id && Object.prototype.hasOwnProperty.call(RETIRED, id)) id = RETIRED[id];
    if (!id || !Object.prototype.hasOwnProperty.call(BG, id)) {
      id = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'graphite' : 'cloud';
    }
    document.documentElement.setAttribute('data-theme', id);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', BG[id]);
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* ── The app's body face (css/theme.css). Two sources: this page is
     copied AS IS into the flat iOS www/ folder, where the file sits beside it
     (no fonts/ folder) — a source that fails to load falls through to the
     next one. File URLs, never data URIs: iOS WebKit rejects large ones. ── */
  @font-face { font-family:'Sofia Sans'; font-style:normal; font-weight:400 800; font-display:swap; src:url('fonts/sofia-sans.woff2') format('woff2'), url('sofia-sans.woff2') format('woff2'); }
  /* …and its display face, for the wordmark and the heading, the same way. */
  @font-face { font-family:'Sofia Sans Condensed'; font-style:normal; font-weight:600 900; font-display:swap; src:url('fonts/sofia-sans-condensed.woff2') format('woff2'), url('sofia-sans-condensed.woff2') format('woff2'); }
  /* ── Design tokens — the handful this page needs, copied value for value
     from css/theme.css (tests/suites/4f-cleanup-pwa.js compares them, theme by
     theme). Inlined, not linked: the page must stand on its own, and the iOS
     build copies it as-is into a flat folder where a css/ path would not
     resolve. <html data-theme> is always one of these ids (see themeBoot). ── */
  :root {
    --radius-xl: 10px; --radius-4xl: 16px; --radius-5xl: 18px; --radius-8xl: 28px; --radius-full: 9999px;
    --tap-min: 44px; --tap-lg: 56px; --hairline: 1.5px;
    --font-display: 'Sofia Sans Condensed', 'Avenir Next Condensed', 'Helvetica Neue', sans-serif;
    --font-body: 'Sofia Sans', 'Helvetica Neue', Helvetica, sans-serif;
  }
  [data-theme="cloud"] {
    --bg: #e6e9ee; --bg-panel: #fcfdfe; --bg-input: #eef1f5; --border: #d3d9e1; --border-light: #c3cad5;
    --text: #1b2130; --text-heading: #1b2130; --text-muted: #3a4252; --text-dim: #485165; --text-ghost: #566073; --text-off: #8a93a3;
    --accent: #1b2130; --accent-hover: #2a3245; --accent-ink: #ffffff; --accent-soft: #d9dee6;
    --badge-full-bg: #fbe1e2; --badge-full-text: #a81f28; --badge-full-border: #f2b8bc;
    --shadow-lg: 0 16px 40px -12px rgba(27,33,48,0.28);
  }
  [data-theme="graphite"] {
    --bg: #12161f; --bg-panel: #1b2130; --bg-input: #262d3e; --border: #2b3345; --border-light: #3b4459;
    --text: #eef1f5; --text-heading: #ffffff; --text-muted: #b7bfcc; --text-dim: #a7b0bf; --text-ghost: #8d97a9; --text-off: #4c566a;
    --accent: #dde3ec; --accent-hover: #c5cdd9; --accent-ink: #1b2130; --accent-soft: #2b3347;
    --badge-full-bg: #3a1b20; --badge-full-text: #ff9aa2; --badge-full-border: #5e2b33;
    --shadow-lg: 0 16px 40px -12px rgba(0,0,0,0.70);
  }
  [data-theme="terminal"] {
    --bg: #060906; --bg-panel: #0a120a; --bg-input: #0e1a0e; --border: #16341a; --border-light: #1f4a25;
    --text: #b8e6b8; --text-heading: #e4ffe4; --text-muted: #8cc78c; --text-dim: #6da86d; --text-ghost: #518a51; --text-off: #2c4c2c;
    --accent: #16a34a; --accent-hover: #15803d; --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #271010; --badge-full-text: #f87171; --badge-full-border: #4a1d1d;
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4), 0 0 32px rgba(22,163,74,0.12);
    --font-body: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  [data-theme="gameboy"] {
    --bg: #0f380f; --bg-panel: #133f13; --bg-input: #1b4d1b; --border: #306230; --border-light: #3f7a3f;
    --text: #9bbc0f; --text-heading: #c6e034; --text-muted: #8bac0f; --text-dim: #8bac0f; --text-ghost: #8bac0f; --text-off: #3f5c28;
    --accent: #9bbc0f; --accent-hover: #8bac0f; --accent-ink: #0f380f; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #2a572a; --badge-full-text: #c6e034; --badge-full-border: #3f7a3f;
    --shadow-lg: 0 4px 0 rgba(0, 0, 0, 0.25);
    --radius-xl: 0; --radius-4xl: 0; --radius-5xl: 0; --radius-8xl: 0; --radius-full: 0;
    --font-body: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  [data-theme="blueprint"] {
    --bg: #0a1c30; --bg-panel: #0e2440; --bg-input: #132d4e; --border: #1c3d61; --border-light: #295380;
    --text: #d8e9f9; --text-heading: #ffffff; --text-muted: #a4c4e0; --text-dim: #84a8c8; --text-ghost: #6e90ad; --text-off: #364f66;
    --accent: #38bdf8; --accent-hover: #1ba2dd; --accent-ink: #06283f; --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --badge-full-bg: #3a1525; --badge-full-text: #ff8097; --badge-full-border: #66293f;
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.35), 0 12px 40px rgba(0,0,0,0.5);
  }
  /* Crisp Colour chrome, as the app wears it: the ground, ONE surface card
     with the sheet radius and no outline, the wordmark and the heading in the
     display face, sentence-case labels, and a full-pill primary action. */
  body {
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card { background: var(--bg-panel); border-radius: var(--radius-8xl); padding: 28px 24px 24px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  /* The five-bar mark wears the default class colours (presentation
     attributes in the markup). Terminal and Handheld are one-colour themes:
     there the bars follow the accent, like every class type in the app. */
  .brand svg .bm-top { fill: var(--text-heading); } .brand svg .bm-bot { fill: var(--text-ghost); }
  .brand .word { font-family: var(--font-display); font-size: 28px; font-weight: 900; letter-spacing: 0.2px; color: var(--text-heading); line-height: 1; }
  h1 { font-family: var(--font-display); font-size: 34px; font-weight: 900; line-height: 1.05; color: var(--text-heading); margin-bottom: 8px; }
  .sub { font-size: 15px; font-weight: 500; color: var(--text-muted); margin-bottom: 24px; line-height: 1.45; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--text-ghost); margin-bottom: 6px; }
  input[type="email"], input[type="password"] {
    width: 100%; min-height: var(--tap-lg); background: var(--bg-input); border: var(--hairline) solid var(--border-light); color: var(--text); font-family: inherit;
    padding: 0 18px; border-radius: var(--radius-4xl); font-size: 16px; font-weight: 500; outline: none; transition: border-color 0.15s; -webkit-appearance: none;
  }
  input::placeholder { color: var(--text-ghost); opacity: 1; }
  input:focus { border-color: var(--text); }
  /* Accent fills are labelled with --accent-ink, never white: on Graphite,
     Handheld and Blueprint the accent is pale and white is unreadable. */
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: var(--tap-lg); background: var(--accent); color: var(--accent-ink); border: none; font-family: inherit;
    padding: 0 24px; border-radius: var(--radius-full); font-size: 18px; font-weight: 800; letter-spacing: 0.1px;
    cursor: pointer; text-align: center; margin-top: 12px; transition: background 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible, .back:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  /* Same pair as the app's .btn:disabled ("Wait 30s" has to stay readable). */
  .btn:disabled { background: var(--text-off); color: var(--text); cursor: not-allowed; }
  .error { background: var(--badge-full-bg); border: var(--hairline) solid var(--badge-full-border); color: var(--badge-full-text); border-radius: var(--radius-4xl); padding: 12px 16px; font-size: 14px; font-weight: 500; margin-top: 16px; display: none; line-height: 1.4; }
  .done-wrap { text-align: center; }
  .done-wrap h1 { margin-bottom: 6px; }
  .ok-mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: var(--radius-full); background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; }
  .back { display: flex; align-items: center; justify-content: center; min-height: var(--tap-min); margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-full); }
  .back:hover { color: var(--text); }
  .fine { margin-top: 12px; font-size: 13px; font-weight: 500; line-height: 1.45; text-align: center; color: var(--text-ghost); }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .btn, input { transition: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="136 136 752 752" aria-hidden="true" focusable="false" width="32" height="32"><defs><mask id="loginGrooves" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><path d="M304.2 367.7A180 180 0 0 1 551.2 328.6" fill="none" stroke="#000" stroke-width="72" stroke-linecap="round"/><path d="M719.8 656.3A180 180 0 0 1 591.7 727.3" fill="none" stroke="#000" stroke-width="72" stroke-linecap="round"/></mask></defs><g mask="url(#loginGrooves)"><path class="bm-top" d="M201.2 476A40 40 0 0 1 161.7 429.6A290 290 0 0 1 734.3 429.6A40 40 0 0 1 694.8 476L534.5 476A16 16 0 0 1 518.8 462.9A72 72 0 0 0 377.2 462.9A16 16 0 0 1 361.5 476Z"/><path class="bm-bot" d="M822.8 548A40 40 0 0 1 862.3 594.4A290 290 0 0 1 289.7 594.4A40 40 0 0 1 329.2 548L489.5 548A16 16 0 0 1 505.2 561.1A72 72 0 0 0 646.8 561.1A16 16 0 0 1 662.5 548Z"/></g></svg>
    <span class="word">Psync</span>
  </div>

  <div id="sLogin">
    <h1>Sign in</h1>
    <p class="sub">Use your Psycle account email and password.</p>
    <!-- A real form: Enter submits, and password managers / VoiceOver see a
         login. preventDefault() comes FIRST, so a script error can never turn
         into a native submit — and the fields deliberately have no name=, so
         even a native submit could not put the password in the URL. -->
    <form id="loginForm" novalidate onsubmit="event.preventDefault();doLogin()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" inputmode="email" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button id="loginBtn" class="btn" type="submit">Sign in</button>
    </form>
    <div id="errMsg" class="error" role="alert"></div>
    <a href="./psycle-finder.html" class="back">&larr; Back to Psync</a>
    <!-- The page takes a Psycle password: it says whose page it is (the
         welcome's own sentence). -->
    <p class="fine">An independent companion for Psycle London members, not affiliated with or endorsed by Psycle.</p>
  </div>

  <div id="sDone" style="display:none" class="done-wrap">
    <div class="ok-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
    <h1>Connected</h1>
    <p class="sub">Returning to Psync&hellip;</p>
    <a href="./psycle-finder.html" class="btn" style="text-decoration:none;margin-top:0">Open Psync</a>
  </div>
</div>

<script>
var APP_URL = (function() {
  var href = location.href;
  var base = href.substring(0, href.lastIndexOf('/') + 1);
  return base + 'psycle-finder.html';
})();

var LOGIN_URL = 'https://psycle.codexfit.com/api/v1/customer/auth/login';

var MAX_ATTEMPTS = 3;
var COOLDOWN_BASE = 30;
var RATE_LIMIT_COOLDOWN = 60; // seconds to stand off after a 429
var LOGIN_TIMEOUT_MS = 15000; // same cap as the app's apiFetch
var _failCount = 0;
var _lockedUntil = 0;
var _cooldownInterval = null;

function checkRateLimit() {
  if (Date.now() < _lockedUntil) {
    var secs = Math.ceil((_lockedUntil - Date.now()) / 1000);
    showError('Too many attempts. Try again in ' + secs + 's.');
    return false;
  }
  return true;
}

// Lock the button for `seconds`, counting down on it.
function startCooldown(seconds) {
  _lockedUntil = Date.now() + seconds * 1000;
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  if (_cooldownInterval) clearInterval(_cooldownInterval);
  var updateCountdown = function() {
    var secs = Math.ceil((_lockedUntil - Date.now()) / 1000);
    if (secs <= 0) {
      clearInterval(_cooldownInterval);
      btn.disabled = false;
      btn.textContent = 'Sign in';
      hideError();
      return;
    }
    btn.textContent = 'Wait ' + secs + 's';
  };
  updateCountdown();
  _cooldownInterval = setInterval(updateCountdown, 1000);
}

// Only an answer that means "Psycle looked at these details and said no"
// counts towards the lockout: a 4xx other than 408 (timeout) / 429 (rate
// limit). Psycle's exact bad-credentials status isn't known, so no single
// code is hard-wired. A dropped connection, a timeout or a 5xx says nothing
// about the password — three taps on a flaky train used to lock a member out.
function countsTowardLockout(status) {
  return status >= 400 && status < 500 && status !== 408 && status !== 429;
}

function onLoginFailure() {
  _failCount++;
  if (_failCount >= MAX_ATTEMPTS) {
    startCooldown(COOLDOWN_BASE * Math.pow(2, Math.floor((_failCount - MAX_ATTEMPTS) / MAX_ATTEMPTS)));
  }
}

function onLoginSuccess() {
  _failCount = 0;
  _lockedUntil = 0;
  if (_cooldownInterval) clearInterval(_cooldownInterval);
}

// The first human-readable line of a failed sign-in. Psycle sends `message`,
// or Laravel-style `errors` ({field: [msg, …]}), which used to be shown as raw
// JSON. Always a plain string: it goes into textContent.
function firstErrorMessage(data, status) {
  if (status === 429) return 'Too many attempts — give it a minute, then try again.';
  if (status >= 500) return 'Psycle is having trouble right now — try again shortly.';
  var pick = function(v) {
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) return v.length ? pick(v[0]) : '';
    if (v && typeof v === 'object') {
      if (typeof v.message === 'string') return v.message;
      var keys = Object.keys(v);
      return keys.length ? pick(v[keys[0]]) : '';
    }
    return '';
  };
  var msg = typeof data === 'string' ? data
    : (data ? (pick(data.message) || pick(data.error) || pick(data.errors)) : '');
  msg = String(msg || '').trim().slice(0, 200);
  return msg || 'Sign in failed (' + status + ')';
}

function showError(msg) {
  var el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errMsg').style.display = 'none';
}

// localStorage is full: drop what the app rebuilds by itself (its timetable
// and reference-list caches — the same keys as _freeAppCaches in security.js)
// so the sign-in has room. Never anything the member entered.
function freeAppCaches() {
  try {
    var doomed = ['psycle_window_cache'];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && (k.indexOf('psycle_cache_') === 0 || k.indexOf('psycle_swr_') === 0)) doomed.push(k);
    }
    doomed.forEach(function(key) { localStorage.removeItem(key); });
  } catch (e) {}
  try { sessionStorage.removeItem('psycle_last_results'); } catch (e) {}
}

var _loginInFlight = false;

async function doLogin() {
  if (_loginInFlight) return;
  if (!checkRateLimit()) return;

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');

  if (!email || !password) {
    showError('Please enter your email and password.');
    return;
  }
  _loginInFlight = true;

  hideError();
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in&hellip;';

  // A hung request used to spin until the OS gave up (about a minute on iOS).
  // The timer stays armed until the body has been read — that can hang too.
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function() { ctrl.abort(); }, LOGIN_TIMEOUT_MS) : null;

  try {
    var res = await fetch(LOGIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: email, password: password }),
      signal: ctrl ? ctrl.signal : undefined
    });

    var data = await res.json().catch(function(e) {
      if (e && e.name === 'AbortError') throw e; // timed out mid-body: not "an empty answer"
      return {};
    });
    clearTimeout(timer);
    if (data == null) data = {};

    if (res.ok) {
      var token = data.token || data.access_token || data.bearer_token
        || (data.data && (data.data.token || data.data.access_token || data.data.bearer_token));

      if (token) {
        onLoginSuccess();
        if (window.opener) {
          // Never broadcast the token with '*': only our own origin may
          // receive it. file:// contexts have no usable origin (the opener
          // reports 'null', and some browsers report 'file://' here — both
          // would make postMessage drop the token) — keep '*' there,
          // matching the relaxed check on the receiving side.
          var target = (location.protocol !== 'file:' && location.origin && location.origin !== 'null')
            ? location.origin : '*';
          window.opener.postMessage({ type: 'PSYCLE_LOGIN_TOKEN', token: token }, target);
        }
        // Its own try: a full localStorage used to land in the catch below and
        // read "Network error" AFTER Psycle had accepted the password — and
        // every retry was another real sign-in that ended the same way.
        var saved = false;
        try {
          localStorage.setItem('psycle_bearer_token', token);
          saved = true;
        } catch (eStore) {
          freeAppCaches();
          try { localStorage.setItem('psycle_bearer_token', token); saved = true; } catch (eStore2) {}
        }
        // With an opener the app already holds the token (postMessage above)
        // and saves it itself; without one this page's copy is the only one.
        if (!saved && !window.opener) {
          showError('Psycle accepted your details, but this device could not save the sign-in — its storage is full. Free up some space, then sign in again.');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          _loginInFlight = false;
          return;
        }
        document.getElementById('password').value = '';
        document.getElementById('sLogin').style.display = 'none';
        document.getElementById('sDone').style.display = '';
        if (window.opener) {
          setTimeout(function() { window.close(); }, 1200);
        } else {
          setTimeout(function() { location.href = APP_URL; }, 1500);
        }
      } else {
        // Field NAMES only — the body of a successful sign-in holds a live
        // token under some name we don't know; it must not land in a console
        // that gets pasted into a bug report.
        var inner = (data && typeof data.data === 'object' && data.data) ? Object.keys(data.data) : [];
        console.log('[psync-login] response fields:', typeof data === 'object' ? Object.keys(data) : typeof data, inner);
        showError('Signed in but no token was returned. Check the console and report the field names.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
        _loginInFlight = false;
      }
    } else {
      if (countsTowardLockout(res.status)) onLoginFailure();
      else if (res.status === 429) startCooldown(RATE_LIMIT_COOLDOWN);
      showError(firstErrorMessage(data, res.status));
      if (Date.now() >= _lockedUntil) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
      _loginInFlight = false;
    }
  } catch (e) {
    // Never reached Psycle (or never heard back): says nothing about the
    // password, so it never counts towards the lockout.
    clearTimeout(timer);
    showError(e && e.name === 'AbortError'
      ? 'Psycle took too long to answer. Check your connection and try again.'
      : 'Network error. Check your connection and try again.');
    if (Date.now() >= _lockedUntil) {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
    _loginInFlight = false;
  }
}
</script>
<!-- The Android app asks the page what its Back button does (MainActivity calls
     window._psycleAndroidBack; js/app.js answers for the app itself). Here it is
     this page's own "Back to Psync" link. The iPhone app and the web never call
     it. (An attribute on the tag, on purpose: the first attribute-less script
     must stay the sign-in logic above.) -->
<script data-android-back>
window._psycleAndroidBack = function () {
  location.href = (typeof APP_URL === 'string' && APP_URL) || './psycle-finder.html';
  return true;
};
</script>
</body>
