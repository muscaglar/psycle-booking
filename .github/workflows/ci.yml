name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, drift & types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # No lockfile is required; fall back to a plain install so the job is
      # robust whether or not package-lock.json is committed.
      - name: Install dependencies
        run: npm ci || npm install

      # Syntax-check every shipped JS file (js/*.js + sw.js + the iOS build
      # script + the hand-maintained native bridge).
      - name: Syntax check (node --check)
        run: npm run check

      # Unit tests (tests/unit.js — a plain `node` runner, no test framework).
      - name: Unit tests
        run: npm run test

      # Verify the flattened ios-app/www/ mirror + SW cache stamp are in sync
      # with root (ios-app/build.js --check).
      - name: iOS www drift check
        run: npm run drift

      # Install the iOS wrapper's JS deps (pure npm — no Xcode needed) so the
      # postinstall plugin patcher (ios-app/patch-plugins.js) runs against the
      # real node_modules here. A plugin bump that breaks a patch anchor then
      # fails on every PR, not only at the mac build / Xcode Cloud archive.
      - name: Install iOS deps (runs plugin patcher)
        working-directory: ios-app
        run: npm ci

      - name: iOS plugin patch check
        working-directory: ios-app
        run: npm run patch:check

      # Whole-app load check: every module, in production order, in a real
      # engine (tests/smoke.html). The page answers every fetch itself, so
      # nothing reaches Psycle's live API; the resolver rule makes that a hard
      # guarantee — no host but this runner resolves at all.
      # The grep is for the PASS banner's MARKUP: the bare words "SMOKE: PASS"
      # also sit in the page's own comments, which --dump-dom prints, so a grep
      # for them alone could never fail (tests/suites/shell.js holds this).
      # Advisory until it has been seen green on a runner once — then delete
      # continue-on-error to make a module that fails to load block the merge.
      - name: Smoke test (headless Chrome, advisory)
        continue-on-error: true
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --silent --fail --retry 10 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:8080/tests/smoke.html
          timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu \
            --host-resolver-rules="MAP * ~NOTFOUND, EXCLUDE 127.0.0.1" \
            --dump-dom http://127.0.0.1:8080/tests/smoke.html > "$RUNNER_TEMP/smoke-dom.html"
          grep -o 'class="line fail-line">[^<]*' "$RUNNER_TEMP/smoke-dom.html" || true
          grep -o 'id="summary">[^<]*' "$RUNNER_TEMP/smoke-dom.html" || true
          grep -q 'class="pass">SMOKE: PASS' "$RUNNER_TEMP/smoke-dom.html"

      # Advisory only: surfaces type/typo issues without failing the build.
      # The vanilla-JS global pattern means strict tsc would be noisy, so this
      # is informational. `continue-on-error` keeps a red typecheck from
      # blocking merges. (The script itself no longer swallows tsc's exit code:
      # a missing or crashing tsc now shows as a failed step, not a green one.)
      - name: Type check (advisory)
        run: npm run typecheck
        continue-on-error: true

      # Advisory only: agents/index/ is a generated map of the code for readers
      # arriving cold (see AGENTS.md). A drifted map is still useful, so a stale
      # one must never block a merge — it only shows up here as a warning.
      - name: Agents index freshness (advisory)
        run: npm run agents:check
        continue-on-error: true

  # Unsigned compile of the full native project (pods + Swift + pbxproj) so
  # iOS breakage surfaces on main, not at archive time. No certificates are
  # involved (simulator destination + CODE_SIGNING_ALLOWED=NO). macOS runners
  # are free on public repos, but this only runs on main pushes (and manual
  # dispatch) to keep runs fast and focused.
  #
  # TestFlight delivery itself is Xcode Cloud's job — see ios-app/CICD.md:
  # every push to main triggers the "Beta Build" Archive → TestFlight
  # workflow (Branch Changes condition), with ios/App/ci_scripts/
  # ci_post_clone.sh preparing the Capacitor toolchain on Apple's runners.
  # This job is the fast, free early-warning that runs alongside it.
  ios-build:
    name: iOS build check (unsigned)
    # Runs in parallel with the web job — it consumes nothing from it, and
    # serializing would just delay iOS feedback by the ubuntu job's runtime.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Install iOS JS dependencies
        working-directory: ios-app
        run: npm ci

      # Same recipe as local dev and Xcode Cloud's ci_post_clone.sh:
      # www/ flatten + cap sync (web assets, Podfile plugin block, pod install).
      - name: Build web assets + sync native project
        working-directory: ios-app
        run: npm run sync

      # -quiet prints warnings/errors only (unbounded), so a failing Swift
      # diagnostic is always visible in the log instead of being cut off.
      - name: Compile (simulator, no signing)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -quiet -workspace App.xcworkspace -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO

  # Debug compile of the Android project (ios-app/android/ — the folder name
  # ios-app/ is historical; both platforms wrap the same ios-app/www/). No
  # keystore and no secret is involved: a debug APK is signed with the debug
  # key Gradle makes on the runner. Same trigger pattern as the iOS job, plus
  # android/** branches, where the Android work is done.
  #
  # `npm run sync:android` = build.js + `cap sync android`. It regenerates what
  # ios-app/android/.gitignore keeps out of the repository (the copied web
  # assets, capacitor.config.json, the Cordova shim project), so Gradle cannot
  # run without it. `npm run sync` stays iOS-only: it is what Xcode Cloud runs.
  #
  # Before the APK: the JVM unit tests of the app module (app/src/test/ — the
  # widget's snapshot rules). They need no emulator, and they BLOCK.
  android-build:
    name: Android build check (debug APK)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/android/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only token: the job reads the repository and uploads artifacts.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token left in .git/config for install-time scripts to read

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # postinstall runs patch-plugins.js here too. It edits Swift sources in
      # node_modules only, which Gradle never compiles.
      - name: Install JS dependencies (lockfile)
        working-directory: ios-app
        run: npm ci

      - name: Build web assets + sync the Android project
        working-directory: ios-app
        run: npm run sync:android

      # The home-screen widget decides what to show in a PURE Java class
      # (java.* and org.json only), so its rules run on this runner's JVM: a
      # class that has started is dropped, the seat words, a snapshot that is
      # not JSON. BLOCKING, and before the APK is compiled: an APK whose widget
      # names the wrong class never becomes an artifact someone installs.
      # :app: only — the plugins' modules ship no tests and are not ours to fix.
      - name: JVM unit tests (the widget's snapshot logic)
        working-directory: ios-app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Gradle's console names a failed test and its line, not what it expected
      # and what it got; the XML result holds both. Nobody can re-run this on a
      # development machine, so the log says it. (When an EARLIER step failed
      # there are no results, and this prints nothing.)
      - name: Show why a JVM test failed
        if: failure()
        continue-on-error: true
        working-directory: ios-app/android
        run: |
          if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            grep -l -E '<(failure|error)[ >]' app/build/test-results/testDebugUnitTest/*.xml | xargs -r cat
          fi

      - name: Upload the unit-test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: ios-app/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 30

      - name: Compile (debug APK)
        working-directory: ios-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psync-debug-apk
          path: ios-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Advisory: Android lint on the app module (the plugins' own modules are
      # not ours to fix). A finding never blocks a merge; the report is kept.
      - name: Android lint (advisory)
        working-directory: ios-app/android
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload the lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: ios-app/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30

  # ADVISORY: installs the APK the job above built on an emulator, opens the
  # app, takes a screenshot, sends ONE hardware back key and takes another.
  # It proves the app starts and that back does not end it (MainActivity asks
  # window._psycleAndroidBack, then moveTaskToBack — never finish()). The
  # pictures and the log are the result: a person reads them.
  #
  # It never taps, swipes or types, so it can book nothing. At launch the app
  # reads Psycle's public timetable (read-only GETs, as the web app does for
  # any visitor); nobody is signed in and nothing is written.
  #
  # Then the home-screen widget. Putting one on a launcher means dragging it
  # there, and this script never touches the screen — so the DEBUG build
  # carries WidgetPreviewActivity (app/src/debug/, never in a release build),
  # which builds the SAME RemoteViews the widget's provider builds and shows
  # them with RemoteViews.apply(). It is opened nine times — compact, wide,
  # wide at night, compact with class colours off (its built-in sample `off`),
  # the empty state, FOUR seats in a two-cell badge, two seats on the
  # narrowest card (110dp), the smallest card there is (110 x 110dp), and a
  # long class name on a card with room for ONE line of it, with the system
  # font at 1.3 (set just before, and put back after: the name must read
  # "REFORMER PILATES", whole) — fed by STRING extras and showing a sample with
  # fictional names; it reads nothing the app stores. A picture is kept of
  # each. `-S` force-stops the app before each start, so every picture is a
  # fresh activity reading ITS extras (a second start of an activity already
  # in front can be "brought to the front" with the old ones). That also ends
  # the process BACK left alive, which is why its id is written to a file
  # first and judged from the file at the end.
  #
  # The emulator is a PHONE (`profile: pixel_6`, 411dp wide at high density).
  # With no profile the AVD is made without a device definition, which is
  # understood — not checked here — to be a 320dp screen at 1 px per dp:
  # narrower than the 328dp wide card plus the page's padding, and too coarse
  # to judge type by. (The preview also fits its frame to the screen it finds,
  # and says so in its caption.) A widget it could NOT draw (RemoteViews.apply()
  # refusing a view or a call: the nearest thing here to a launcher's "Problem
  # loading widget") is logged as an error under the tag PsyncWidgetPreview,
  # and the last line of the script looks for that tag.
  #
  # The repository is not checked out here: the runner holds the APK only.
  # Each line of `script:` runs as its own `sh -c`, so no line depends on a
  # shell variable, a `cd` or a multi-line construct from another — and the
  # first line that fails ends the script. So evidence is gathered first, every
  # widget line ends in `|| true` (a preview that will not open must not cost
  # the log or the verdict), and the lines that can fail the step come last.
  android-smoke:
    name: Android emulator smoke (advisory)
    needs: android-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/android/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never fails the workflow: a slow or flaky emulator is not a broken app.
    continue-on-error: true
    permissions: {}

    steps:
      - name: Download the debug APK
        uses: actions/download-artifact@v4
        with:
          name: psync-debug-apk
          path: apk

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Hardware acceleration for the emulator on a hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make the output folder
        run: mkdir -p android-smoke

      - name: Launch on an emulator, one back key, then the widget preview
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0 (third-party: pinned to a commit, not a moving tag)
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.psyclefinder.app/.MainActivity
            sleep 25
            adb exec-out screencap -p > android-smoke/launch.png
            adb shell input keyevent 4
            sleep 5
            adb exec-out screencap -p > android-smoke/after-back.png
            adb shell pidof com.psyclefinder.app > android-smoke/pid-after-back.txt || true
            adb logcat -d -s 'Capacitor:*' 'chromium:*' 'AndroidRuntime:E' > android-smoke/logcat.txt
            adb logcat -c || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-compact-light.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size wide --es night 0 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-wide-light.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size wide --es night 1 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-wide-dark.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 --es sample off || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-compact-off.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 --es empty 1 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-empty.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 --es sample four || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-compact-four-seats.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 --es sample two --es width 110 --es height 140 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-compact-narrow.png || true
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 --es width 110 --es height 110 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-compact-smallest.png || true
            adb shell settings put system font_scale 1.3 || true
            sleep 3
            adb shell am start -S -W -n com.psyclefinder.app/.WidgetPreviewActivity --es size compact --es night 0 --es sample long --es height 150 || true
            sleep 4
            adb exec-out screencap -p > android-smoke/widget-compact-large-type.png || true
            adb shell settings put system font_scale 1.0 || true
            adb logcat -d '*:W' > android-smoke/logcat-widget.txt || true
            grep -q '[0-9]' android-smoke/pid-after-back.txt
            ! grep -q 'FATAL EXCEPTION' android-smoke/logcat.txt
            ! grep -q 'Process: com.psyclefinder.app' android-smoke/logcat-widget.txt
            ! grep -q 'PsyncWidgetPreview' android-smoke/logcat-widget.txt

      - name: Upload the screenshots and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 30

      - name: Say so when the smoke did not pass
        if: steps.emulator.outcome == 'failure'
        run: echo "::warning title=Android emulator smoke::The advisory emulator smoke did not pass - read the android-smoke artifact (launch.png, after-back.png, pid-after-back.txt, logcat.txt, the nine widget-*.png, logcat-widget.txt)."
