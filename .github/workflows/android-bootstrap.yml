# TEMPORARY — generates the Capacitor Android platform on a machine that can reach the public npm registry and has
# a JDK + Android SDK (a GitHub runner), compiles it, and hands the generated project + lockfile back as an artifact.
# It is deleted again once ios-app/android/ is committed; the permanent Android job lives in ci.yml.
name: Android bootstrap (temporary)

on:
  push:
    branches: ['android/**']
  workflow_dispatch:

# Read-only token: the job only reads the repository and uploads artifacts.
permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate + compile the Android platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token left in .git/config for install-time scripts to read
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies (lockfile)
        working-directory: ios-app
        run: npm ci

      - name: Add the Android platform package (same major as @capacitor/core)
        working-directory: ios-app
        run: |
          CORE=$(node -p "require('@capacitor/core/package.json').version")
          echo "core is $CORE"
          npm install "@capacitor/android@$CORE"
          node -p "'android is ' + require('@capacitor/android/package.json').version"
          echo "--- what changed in package.json / package-lock.json"
          git --no-pager diff --stat -- package.json package-lock.json
          git --no-pager diff -U2 -- package.json package-lock.json | head -80

      - name: Generate the Android project (only when it is not committed yet)
        working-directory: ios-app
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # @ebarooni/capacitor-calendar 6.7.2 pins androidx.core:core-ktx:1.15.0, which must be COMPILED against API 35.
      # Only the compile SDK moves (what the code may call); targetSdk stays as generated, so runtime behaviour does not.
      # AGP 8.2 predates API 35 and says so as a warning; the property below records that this is deliberate.
      - name: Compile against API 35 (target stays as generated)
        working-directory: ios-app/android
        run: |
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/' variables.gradle
          grep -q 'compileSdkVersion = 35' variables.gradle
          grep -q 'suppressUnsupportedCompileSdk' gradle.properties || printf '\n# compileSdk 35 is deliberate (see variables.gradle); AGP 8.2 only knows up to 34.\nandroid.suppressUnsupportedCompileSdk=35\n' >> gradle.properties
          tail -4 gradle.properties

      - name: What was generated
        working-directory: ios-app
        run: |
          find android -maxdepth 3 -not -path '*/build/*' -not -path '*/.gradle/*' | sort | head -80
          echo "--- variables.gradle"; cat android/variables.gradle
          echo "--- capacitor.settings.gradle"; cat android/capacitor.settings.gradle
          echo "--- AndroidManifest"; cat android/app/src/main/AndroidManifest.xml

      - name: Compile (debug APK)
        working-directory: ios-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Hand back the generated project + lockfile
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ios-app/android
            !ios-app/android/**/build
            !ios-app/android/.gradle
            !ios-app/android/app/src/main/assets/public
            ios-app/package.json
            ios-app/package-lock.json

      - name: Hand back the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psync-debug-apk
          if-no-files-found: error
          path: ios-app/android/app/build/outputs/apk/debug/app-debug.apk
