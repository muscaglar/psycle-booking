apply plugin: 'com.android.application'

// ── Release signing, with no secret in this repository ────────────────────────
// The four values come from the environment, or from android/keystore.properties (git-ignored;
// the same four names, lower-case keys below). The environment wins. The keystore file itself
// lives outside the repository, or under a git-ignored name (*.jks, *.keystore).
//
//   PSYNC_KEYSTORE_FILE        storeFile       path to the keystore (relative paths: from android/)
//   PSYNC_KEYSTORE_PASSWORD    storePassword
//   PSYNC_KEY_ALIAS            keyAlias
//   PSYNC_KEY_PASSWORD         keyPassword
//
// With all four present, release builds are signed with that key. With any missing, NO release
// signing config is set: assembleDebug is untouched (it always uses Android's debug key), and
// assembleRelease / bundleRelease still succeed and produce an UNSIGNED artefact, which cannot
// be installed or uploaded by mistake. A release is never signed with the debug key.
def psyncSigningEnv = [
    storeFile    : 'PSYNC_KEYSTORE_FILE',
    storePassword: 'PSYNC_KEYSTORE_PASSWORD',
    keyAlias     : 'PSYNC_KEY_ALIAS',
    keyPassword  : 'PSYNC_KEY_PASSWORD'
]
def psyncSigning = [:]
def psyncSigningFile = rootProject.file('keystore.properties')
if (psyncSigningFile.exists()) {
    def psyncSigningProps = new Properties()
    psyncSigningFile.withInputStream { stream -> psyncSigningProps.load(stream) }
    psyncSigningEnv.keySet().each { key ->
        if (psyncSigningProps.getProperty(key)) {
            psyncSigning[key] = psyncSigningProps.getProperty(key)
        }
    }
}
psyncSigningEnv.each { key, variable ->
    if (System.getenv(variable)) {
        psyncSigning[key] = System.getenv(variable)
    }
}
def psyncCanSign = psyncSigningEnv.keySet().every { key -> psyncSigning[key] }

android {
    namespace "com.psyclefinder.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.psyclefinder.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: a whole number that must go UP with every upload to Play; it is never shown.
        // versionName: what a member sees. Both are set by hand here, before a release build.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Declared before buildTypes, which names it. Only when all four values are present: see the top.
    signingConfigs {
        if (psyncCanSign) {
            release {
                storeFile rootProject.file(psyncSigning.storeFile)
                storePassword psyncSigning.storePassword
                keyAlias psyncSigning.keyAlias
                keyPassword psyncSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (psyncCanSign) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // The widget's snapshot reader (widget/PsyncSnapshot.java) parses JSON with org.json and is run by
    // plain JVM tests (app/src/test); android.jar's org.json is a stub there that throws "not mocked".
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
